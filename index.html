<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b6495d" />
    <title>A Letter for You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Sacramento&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <audio id="love-music" preload="auto"></audio>
    <main class="scene">
      <div class="heart-burst" id="heart-burst" aria-hidden="true"></div>
      <p class="eyebrow">A small note, made just for you</p>

      <button class="envelope-button" id="envelope-button" type="button" aria-expanded="false" aria-label="Open your letter">
        <span class="letter" id="letter" aria-hidden="true">
          <span class="letter-stamp">Happy Girlfriend's Day</span>
          <span class="letter-rule"></span>
          <span class="letter-greeting">My dearest Tishya,</span>
          <span class="letter-copy">Every day with you feels like a little more color in my life. Thank you for being my calm, my happiness, and one of the best parts of every day.</span>

          <span class="memory-keepsake">
            <img class="memory-photo" src="images/tishya-memories.png" alt="A collage of Tishya's favorite memories" />
            <span class="memory-details">
              <span class="memory-label">Our little story</span>
              <span class="relationship-number" id="days-together">0</span>
              <span class="relationship-label">days of us</span>
              <span class="memory-date">Since 26 January 2026</span>
            </span>
          </span>

          <span class="letter-copy">I love the way you make ordinary moments feel special. I am so lucky that our story is mine to be part of, and I will keep choosing you in all the little ways and all the big ones.</span>
          <span class="letter-signoff">Always yours,</span>
          <span class="letter-name">with all my love</span>
        </span>

        <span class="envelope" aria-hidden="true">
          <span class="envelope-back"></span>
          <span class="envelope-flap"></span>
          <span class="envelope-front envelope-left"></span>
          <span class="envelope-front envelope-right"></span>
          <span class="envelope-front envelope-bottom"></span>
          <span class="seal">&#9829;</span>
        </span>
      </button>

      <p class="instruction" id="instruction">Tap the envelope to open</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
